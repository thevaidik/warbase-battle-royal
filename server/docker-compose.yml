version: '3.8'

services:
  warbase-server:
    build: 
      context: ../
      dockerfile: server-swift/Dockerfile
    container_name: warbase-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ENV=production
      - PORT=8081

  # Optional: You can run cloudflared directly in this stack to expose the server.
  # Just replace the token below with your actual Cloudflare Tunnel token.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: warbase-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=YOUR_CLOUDFLARE_TUNNEL_TOKEN_HERE
