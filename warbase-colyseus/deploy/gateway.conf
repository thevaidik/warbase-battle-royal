map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen ${WARBASE_GATEWAY_LISTEN};
    server_name _;
    absolute_redirect off;

    # Only the pinned Cloudflare tunnel connector may supply the public caller
    # address. Nginx replaces client-provided forwarding headers below.
    set_real_ip_from ${WARBASE_TUNNEL_TRUST_CIDR};
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    set $combat_upstream ${WARBASE_COMBAT_UPSTREAM};

    location = / { return 302 /colyseus/?release=admission-v1; }
    location = /colyseus { return 308 /colyseus/; }
    location = /connect { return 410 "Legacy combat backend retired. Update your game client.\n"; }
    location = /colyseus/connect { return 410 "Legacy combat backend retired. Update your game client.\n"; }
    location ~ ^/(colyseus/)?(monitor|playground|admin|admin-api)(?:/|$) { return 404; }

    location / {
        rewrite ^/colyseus/(.*)$ /$1 break;
        proxy_pass http://$combat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /colyseus;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Warbase-Gateway-Token ${WARBASE_GATEWAY_TOKEN};
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
