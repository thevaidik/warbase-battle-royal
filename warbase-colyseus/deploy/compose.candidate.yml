services:
  warbase-colyseus-candidate:
    image: ${COLYSEUS_CANDIDATE_IMAGE:-warbase-colyseus:candidate}
    build:
      context: ../..
      dockerfile: warbase-colyseus/Dockerfile.candidate
    container_name: warbase-colyseus-candidate
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8081"
      STATIC_DIR: /app/static
      PUBLIC_ADDRESS: ${COLYSEUS_PUBLIC_ADDRESS:-war.vaidik.blog/colyseus}
    ports:
      - "8082:8081"
    networks:
      warbase_server_default:
        aliases:
          - warbase-colyseus-candidate
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  warbase_server_default:
    external: true
