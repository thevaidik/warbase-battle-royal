# Include this location inside the existing HTTPS server block only after
# reviewing the isolated candidate. The trailing slash strips /colyseus/.
# Keep aggregate operations metrics off the public gateway, even with bearer auth.
location = /colyseus/internal/metrics {
    return 404;
}

location ^~ /colyseus/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
