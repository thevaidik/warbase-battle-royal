name: WarBaseClient
options:
  bundleIdPrefix: com.warbase
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7RWMCRQ389
    CODE_SIGN_IDENTITY: "Apple Development"
    PRODUCT_BUNDLE_IDENTIFIER: com.warbase.WarBaseClient
    PRODUCT_NAME: "$(TARGET_NAME)"
    INFOPLIST_FILE: Info.plist
    MACOSX_DEPLOYMENT_TARGET: "15.0"

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"

targets:
  WarBaseClient:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
